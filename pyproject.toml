[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping-assistant"
version = "0.1.1"
description = "Evidence-aware product filtering through MCP and OpenAI Decisions"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=4.1,<5",
  "openai>=3.26,<4",
  "httpx>=0.28,<0.29",
  "beautifulsoup4>=4.13,<5",
  "python-dotenv>=1.1,<2",
  "pydantic>=2.12,<3",
]

[project.scripts]
shopping-assistant = "shopping_assistant.cli:main"
shopping-assistant-mcp = "shopping_assistant.server:main"

[tool.setuptools.packages.find]
include = ["shopping_assistant*"]
